name: Build APK

# Pushes and pull requests: the debug APK and the unit tests.
# A tag v<version> (the version in heavenfall/VERSION): the build job also builds the release APK, unsigned; it never
# sees the signing key. The release job then runs in the environment "release" (its required reviewers approve it):
# only for a tag whose commit is on main, it signs that APK with the key from the environment's secrets, checks it and
# creates the release on the tagged commit. A missing secret fails it: it never signs with the debug key.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The Gradle wrapper is Gradle's own
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Tag matches heavenfall/VERSION
        if: env.IS_RELEASE == 'true'
        run: |
          V=$(tr -d '\r\n ' < heavenfall/VERSION)
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "The tag is $GITHUB_REF_NAME but heavenfall/VERSION says $V." >&2
            exit 1
          fi
      - name: Tools (CMake, Ninja, NDK 27.0.12077973, the SDK's CMake 3.22.1)
        run: |
          pip install --require-hashes --only-binary :all: -r .github/ci-requirements.txt
          # the SDK's CMake is the one Gradle's externalNativeBuild asks for (libheavenfall.so)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Native host tests (the patch set's applier and its JNI layer)
        run: sh heavenfall/jni/test/run_tests.sh
      - name: Release file tool
        run: python -m unittest discover -s heavenfall/tools
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/sdl3
          key: sdl3-3.4.18-${{ hashFiles('scripts/build_sdl3.sh') }}
      - name: Build SDL3
        run: sh scripts/build_sdl3.sh
      - name: Build APK (debug)
        run: sudo ln -sf bash /bin/sh && sh scripts/build_apk.sh
      - name: Unit tests
        working-directory: android
        run: sh ./gradlew testDebugUnitTest
      - name: Release APK, unsigned (on a v* tag)
        if: env.IS_RELEASE == 'true'
        working-directory: android
        run: |
          test ! -e keystore.properties && test ! -e mh4u.keystore
          sh ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../Heavenfall-android-unsigned.apk
      - name: Name the APK
        if: env.IS_RELEASE != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Heavenfall-android-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: |
            Heavenfall-android-debug.apk
            Heavenfall-android-unsigned.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag's commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $GITHUB_REF_NAME is on $GITHUB_SHA, which is not on main: no release." >&2
            exit 1
          fi
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: apk
      - name: Sign and check (the release key, never the debug one)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "The release needs these secrets of the environment release, and they are missing:$missing" >&2
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          # 16 KB pages: the native libraries aligned to 16 KB inside the APK, before the signature
          "$TOOLS/zipalign" -f -P 16 4 Heavenfall-android-unsigned.apk aligned.apk
          "$TOOLS/apksigner" sign --ks "$KS" --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --out Heavenfall-android.apk aligned.apk
          rm -f "$KS" aligned.apk
          "$TOOLS/zipalign" -c -P 16 4 Heavenfall-android.apk
          "$TOOLS/apksigner" verify --print-certs Heavenfall-android.apk | tee signer.txt
          if grep -qi "Android Debug" signer.txt; then
            echo "The release APK is signed with the debug key." >&2
            exit 1
          fi
      - name: Checksum and release file
        run: |
          sha256sum Heavenfall-android.apk > Heavenfall-android.apk.sha256
          # the file the app reads when GitHub's API gives no usable answer: GitHub's "latest release" shape
          python3 heavenfall/tools/make_release_json.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --out Heavenfall-android-release.json Heavenfall-android.apk Heavenfall-android.apk.sha256
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" Heavenfall-android.apk Heavenfall-android.apk.sha256 Heavenfall-android-release.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Heavenfall ${TAG#v}" --generate-notes \
            --notes "Heavenfall is a modified version of 4u-native by khorne-hub (https://github.com/khorne-hub/4u-native). It is not the original and is not made or endorsed by khorne-hub. It holds no game data."
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" aligned.apk
