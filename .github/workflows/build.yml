name: Build APK

# Pushes and pull requests: the debug APK and the unit tests.
# A tag v<version> (the version in heavenfall/VERSION): the release APK signed with the release key from the repository's
# secrets, and the release on the tagged commit. A tag build fails when a secret is missing: it never signs with the
# debug key.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Tag matches heavenfall/VERSION
        if: env.IS_RELEASE == 'true'
        run: |
          V=$(tr -d '\r\n ' < heavenfall/VERSION)
          if [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "The tag is $GITHUB_REF_NAME but heavenfall/VERSION says $V." >&2
            exit 1
          fi
      - name: Tools (CMake, Ninja, NDK 27.0.12077973)
        run: |
          pip install cmake ninja
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: build/sdl3
          key: sdl3-3.4.18-${{ hashFiles('scripts/build_sdl3.sh') }}
      - name: Signing key (a tag build needs all four secrets)
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "The release needs these secrets, and they are missing:$missing" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/mh4u.keystore
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
      - name: Build SDL3
        run: sh scripts/build_sdl3.sh
      - name: Build APK
        run: sudo ln -sf bash /bin/sh && sh scripts/build_apk.sh
      - name: Unit tests
        working-directory: android
        run: sh ./gradlew testDebugUnitTest
      - name: Name the APK
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk Heavenfall-android.apk
            # signed with the release key, never the debug one
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
            "$APKSIGNER" verify --print-certs Heavenfall-android.apk | tee signer.txt
            if grep -qi "Android Debug" signer.txt; then
              echo "The release APK is signed with the debug key." >&2
              exit 1
            fi
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk Heavenfall-android-debug.apk
          fi
      - name: Checksum
        if: env.IS_RELEASE == 'true'
        run: sha256sum Heavenfall-android.apk > Heavenfall-android.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: |
            Heavenfall-android*.apk
            Heavenfall-android.apk.sha256
          if-no-files-found: error
      - name: Release (on a v* tag)
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" Heavenfall-android.apk Heavenfall-android.apk.sha256 \
            --target "$GITHUB_SHA" --title "Heavenfall ${TAG#v}" --generate-notes \
            --notes "Heavenfall is a modified version of 4u-native by khorne-hub (https://github.com/khorne-hub/4u-native). It is not the original and is not made or endorsed by khorne-hub. It holds no game data."
      - name: Remove the signing key
        if: always()
        run: rm -f android/mh4u.keystore android/keystore.properties
